# Daily refresh. Fetches what Congress and the state legislatures say today,
# rebuilds the bills table and the calendar table, and says what changed.
#
# A first small job (key) looks whether the Open States key is set. If it is
# not, the run says so and stops there, with no failure reported.
#
# Then three jobs, each with only the permission it needs:
#
# 1. refresh: runs tools/refresh.sh and every check built into the tools. It can
#    read this repository and nothing else. If the new tables look broken (far
#    fewer bills than the day before, or a state that lost all its bills), it
#    stops here.
# 2. record: commits the new tables to this repository. It runs only after a
#    full pass, and only when the repository variable RECORD_ENABLED is "true".
#    Until the owner switches that on, a run changes nothing: its report and
#    tables can be read on the run's own page.
# 3. report-failure: opens an issue when a run fails, so a broken refresh is
#    seen and the published tables stay as they were.
#
# The Open States key is a repository secret (OPENSTATES_KEY). It is passed to
# the step that looks whether it is set and to the step that asks Open States,
# and is never printed.
#
# What was fetched is kept between runs in the job's cache, so a legislature's
# site is asked only for a bill it has posted a newer version of.
name: refresh

on:
  schedule:
    - cron: "23 10 * * *" # 10:23 UTC every day, early morning in the United States
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  key:
    # Without the Open States key there is nothing to fetch. A run then says so and stops, and no
    # failure is reported: the key not being set yet is not a broken refresh.
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      set: ${{ steps.look.outputs.set }}
    steps:
      - name: Is the Open States key set?
        id: look
        env:
          OPENSTATES_KEY: ${{ secrets.OPENSTATES_KEY }}
        run: |
          if [ -n "$OPENSTATES_KEY" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "The repository secret OPENSTATES_KEY is not set, so this run fetched nothing and changed nothing." >> "$GITHUB_STEP_SUMMARY"
          fi

  refresh:
    needs: key
    if: ${{ needs.key.outputs.set == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bring back what earlier runs fetched
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The pages as first downloaded (*.src) are left out: the words read from them are kept.
          path: |
            raw
            !raw/state-texts/*.src
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Install the PDF reader
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Fetch, rebuild, compare
        env:
          OPENSTATES_KEY: ${{ secrets.OPENSTATES_KEY }}
        run: sh tools/refresh.sh
      - name: Show the report on the run's page
        if: always()
        run: |
          if [ -f raw/report.md ]; then cat raw/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep what was fetched for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            raw
            !raw/state-texts/*.src
          key: raw-${{ github.run_id }}
      - name: Keep the new tables and the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tables
          path: |
            data/
            federal-bills.csv
            state-bills.csv
            state-bills-not-listed.csv
            state-texts-index.json
            needs-reading.csv
            raw/report.md
            raw/report-line.txt
          if-no-files-found: error

  record:
    # Runs only after a full pass, and only once the owner has switched it on.
    needs: refresh
    if: ${{ needs.refresh.result == 'success' && vars.RECORD_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tables
          path: _new
      - name: Commit the new tables
        run: |
          cp _new/data/* data/
          cp _new/federal-bills.csv _new/state-bills.csv _new/state-bills-not-listed.csv _new/state-texts-index.json _new/needs-reading.csv .
          line="$(cat _new/raw/report-line.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data federal-bills.csv state-bills.csv state-bills-not-listed.csv state-texts-index.json needs-reading.csv
          git diff --cached --quiet || git commit -m "Refresh of $(date -u +%F): $line"
          git push

  report-failure:
    needs: [refresh, record]
    if: ${{ always() && (needs.refresh.result == 'failure' || needs.record.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Daily refresh failed on $(date -u +%F)" --body "The refresh did not pass, so the tables were not changed.

          Run: $RUN_URL

          The run's log names the step that failed. If a report was made, it is on the run's page."
